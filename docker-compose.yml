# Nomad Lens — test and demo environment in Docker.
#
#   docker compose run --rm tests          # run the whole suite (unit + integration)
#   docker compose --profile demo up        # dev Nomad on :4646 + sample job
#
# The `tests` service starts its own throwaway `nomad agent -dev` (like CI): it
# tests the logic end to end without depending on the demo profile.
# The `demo` profile instead starts a persistent Nomad to point the extension at
# (nomadLens.clusters → http://127.0.0.1:4646).

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    # The `nomad agent -dev` spawned by the integration tests must be able to create
    # its own cgroups: it needs a writable cgroup + host cgroupns.
    privileged: true
    cgroup: host
    environment:
      NOMAD_BIN: nomad
    volumes:
      - .:/app
      # Isolated node_modules: the Linux container's native binaries
      # (esbuild/typescript) must not mix with the host's.
      - nl_node_modules:/app/node_modules
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: sh -c "npm ci && npm test"

  nomad:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.test
    command: nomad agent -dev -bind 0.0.0.0 -config /etc/nomad/dev.hcl
    privileged: true
    cgroup: host
    ports:
      - "4646:4646"
    volumes:
      - ./docker/nomad-dev.hcl:/etc/nomad/dev.hcl:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD", "nomad", "node", "status"]
      interval: 3s
      timeout: 3s
      retries: 20

  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      nomad:
        condition: service_healthy
    environment:
      NOMAD_ADDR: http://nomad:4646
    volumes:
      - ./docker/seed-job.nomad:/seed.nomad:ro
    command: sh -c "nomad job run /seed.nomad && echo 'job di esempio registrato'"

volumes:
  nl_node_modules:
