name: Pages

# Publishes the site (site/) to GitHub Pages. `site/guide.html` is GENERATED from
# docs/GUIDE.md by `npm run site` — the guide in the repo is the single source of
# truth, so the published documentation cannot drift from it. `configure-pages`
# with enablement:true enables Pages by itself on the first run, if the Actions
# permissions allow it; otherwise enable it once in Settings → Pages
# (Source: GitHub Actions).

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "docs/GUIDE.md"
      - "scripts/build-site.ts"
      - "src/core/markdown.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Generate guide.html from docs/GUIDE.md
        run: npm run site
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
